name: auto-merge-docs-tests

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-docs-tests-${{ github.event.pull_request.number || inputs.pull_request }}
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Inspect API metadata only: never check out or execute the PR's code.
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const number = context.payload.pull_request?.number
              ?? Number(context.payload.inputs.pull_request);
            const params = { ...context.repo, pull_number: number };
            const { data: pr } = await github.rest.pulls.get(params);
            if (pr.state !== 'open') return;

            const allowed = path => /^(docs|tests)\//.test(path);
            // Files that change how later sessions read and update knowledge are merged
            // by a person, so a PR touching them never qualifies for the automation.
            const protectedPaths = [
              'AGENTS.md',
              'docs/knowledge/README.md',
              '.github/workflows/auto-merge-docs-tests.yml',
              '.github/tests/auto-merge-docs-tests.test.cjs',
            ];
            // Instruction files an agent loads at any depth, such as a nested CLAUDE.md,
            // are protected too. Names are compared in lower case, as on Windows and macOS.
            const instruction = path => {
              const parts = path.toLowerCase().split('/');
              return ['agents.md', 'agents.override.md', 'claude.md', 'claude.local.md'].includes(parts.at(-1))
                || parts.includes('.claude');
            };
            const listed = path => protectedPaths.some(rule => rule.toLowerCase() === path.toLowerCase());
            const mergeable = path => allowed(path) && !listed(path) && !instruction(path);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...params, per_page: 100,
            });
            // Only PRs by people who can already push here qualify: anyone can open a PR
            // against this public repository, and the approval here is automatic. The
            // repository permission is read rather than author_association, which shows an
            // organization member with a private membership as CONTRIBUTOR.
            const trusted = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo, username: pr.user.login,
            }).then(({ data }) => ['admin', 'write'].includes(data.permission), error => {
              core.warning(`Could not read the permission of ${pr.user.login}: ${error.message}`);
              return false;
            });
            const eligible = trusted && pr.base.ref === 'master' && !pr.draft
              && files.length > 0 && files.length === pr.changed_files
              && files.every(file => mergeable(file.filename)
                && (!file.previous_filename || mergeable(file.previous_filename)));

            // A push or retarget during pagination invalidates this decision.
            const { data: current } = await github.rest.pulls.get(params);
            if (current.state !== 'open'
                || current.head.sha !== pr.head.sha
                || current.base.sha !== pr.base.sha
                || current.base.ref !== pr.base.ref
                || current.draft !== pr.draft
                || current.changed_files !== pr.changed_files) {
              core.info('PR changed during inspection; leave it to the next run.');
              return;
            }

            const repo = `${context.repo.owner}/${context.repo.repo}`;
            if (!eligible) {
              // Preserve auto-merge requests explicitly enabled by a maintainer.
              if (current.auto_merge?.enabled_by?.login === 'github-actions[bot]') {
                await exec.exec('gh', [
                  'pr', 'merge', String(number), '--repo', repo, '--disable-auto',
                ]);
              }
              core.info('Only non-draft PRs by people with write access, confined to docs/ '
              + 'and tests/ and without the paths a person has to merge, qualify.');
              return;
            }
            if (current.auto_merge) return;

            const emoji = files.some(file => file.filename.startsWith('tests/'))
              ? '✅' : '📝';
            await exec.exec('gh', [
              'pr', 'merge', String(number), '--repo', repo,
              '--auto', '--squash', '--match-head-commit', current.head.sha,
              '--subject', `${emoji} ${current.title} (#${number})`,
            ]);
